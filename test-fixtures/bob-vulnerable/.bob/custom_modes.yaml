customModes:
  - slug: dev-helper
    name: 🛠️ DevHelper
    whenToUse: General-purpose dev mode (intentionally vulnerable - PS-004)
    roleDefinition: >-
      You are a developer assistant with shell, edit, and MCP access.
    groups:
      - read
      - edit
      - command
      - mcp
    # NOTE: no rules-dev-helper/ directory => no behavioural guardrails.

  - slug: broad-editor
    name: ✏️ BroadEditor
    whenToUse: Editor mode (intentionally vulnerable - PS-004 high)
    roleDefinition: >-
      You are an editor with browse access and no scoping rules.
    groups:
      - read
      - edit
      - browser
    # No rules-broad-editor/ => triggers PS-004 high.
